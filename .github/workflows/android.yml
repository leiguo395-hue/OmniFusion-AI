name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/liquid-intelligence-v2]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.OMNI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android SDK.
      # Avoid setup-android action's obsolete sdkmanager 'tools' request.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Inspect APK signing certificate
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OmniFusion-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare stable signing key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          OMNI_KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
        run: |
          printf '%s' "$OMNI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/omni-release.jks"
      - name: Build installable signed release
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          OMNI_KEYSTORE_PATH: ${{ runner.temp }}/omni-release.jks
          OMNI_STORE_PASSWORD: ${{ secrets.OMNI_STORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload signed release
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: OmniFusion-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
